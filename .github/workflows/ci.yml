name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    name: Pint + Larastan + Pest
    runs-on: ubuntu-latest

    # Scout (Module 12) interroge un vrai Meilisearch pendant les tests -
    # phpunit.xml ne fixe pas SCOUT_DRIVER comme il fixe CACHE_STORE=array,
    # donc .env.example (SCOUT_DRIVER=meilisearch) s'applique tel quel ici
    # aussi. Pas de --health-cmd ici : l'image officielle getmeili/meilisearch
    # est minimale (pas de wget/curl/shell à l'intérieur) - un healthcheck
    # Docker dessus fait échouer "Initialize containers" avant même le
    # premier step (constaté en CI réelle). On attend sa disponibilité
    # depuis le runner à la place (qui a curl), pas depuis le conteneur.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.53
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Wait for Meilisearch
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:7700/health; do sleep 1; done'

      # project_id doit être déclaré filterable avant le premier ->where()
      # dessus (Task::search()->where('project_id', ...)) - update() ne
      # pousse jamais les réglages tout seul, seule cette commande le fait.
      - name: Sync Meilisearch index settings
        run: php artisan scout:sync-index-settings

      # Base SQLite en mémoire (phpunit.xml) : aucun service MySQL nécessaire
      # pour les tests, ils tournent identiquement en local et en CI.
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Tests (Pest)
        run: php artisan test
