name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    name: Pint + Larastan + Pest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      # Base SQLite en mémoire (phpunit.xml) : aucun service MySQL nécessaire
      # pour les tests, ils tournent identiquement en local et en CI.
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Tests (Pest)
        run: php artisan test
